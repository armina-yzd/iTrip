version: '3.8'

services:
  manage_services:
    container_name: manage_services
    build: 
      context: ../services/manage_services
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - IAM_URL=${IAM_URL}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.manage_services.rule=Host(`manageServices.localhost`)"
      - "traefik.http.routers.manage_services.entrypoints=web"
      - "traefik.http.services.manage_services.loadbalancer.server.port=8000"
    networks:
      - app-network 
    depends_on:
      postgres_container:
        condition: service_healthy
      
    restart: unless-stopped
        
  postgres_container:
    image: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - app-network
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    networks:
      - app-network
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres_container:
        condition: service_healthy
    restart: unless-stopped

networks:
  app-network:
    driver: bridge 
volumes:
  postgres_data: