version: '3.8'

services:
  iam:
    container_name: iam
    build: 
      context: ../services/iam
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - REFRESH_SECRET=${REFRESH_SECRET}
      - OTP_EXPIRE_TIME=${OTP_EXPIRE_TIME}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SECRET=${SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.iam.rule=Host(`iam.localhost`)"
      - "traefik.http.routers.iam.entrypoints=web"
      - "traefik.http.services.iam.loadbalancer.server.port=8000"
    networks:
      - app-network 
    depends_on:
      redis:
        condition: service_healthy
      postgres_container:
        condition: service_healthy
      
    restart: unless-stopped
        
  postgres_container:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - app-network
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    networks:
      - app-network
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres_container:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis
    container_name: redis_iam
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - ./data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - app-network
    healthcheck: 
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  app-network:
    driver: bridge 
volumes:
  postgres_data: